services:
  - type: web
    name: gsl-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3000
      - key: VITE_SUPABASE_URL
        sync: false # Set this in Render Dashboard
      - key: VITE_SUPABASE_ANON_KEY
        sync: false # Set this in Render Dashboard
